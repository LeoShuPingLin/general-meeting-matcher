<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>總會人員配對</title>
<style>
:root{--bg:#f7f5ef;--paper:#fff;--ink:#243d38;--muted:#677773;--line:#e3e8e1;--green:#286653;--mint:#e1f1e8;--orange:#956016;--soft:#fff1d9;--red:#9c4d4c;--pink:#f8e9e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;padding:8px 12px;font-weight:650}button:focus-visible,select:focus-visible{outline:3px solid #78a694;outline-offset:2px}button[aria-pressed=true]{background:var(--mint);border-color:#82b69f;color:var(--green)}button.no[aria-pressed=true]{background:var(--pink);border-color:#dcb1aa;color:var(--red)}button:disabled{opacity:.42;cursor:default}.wrap{max-width:720px;margin:auto;padding:24px 16px calc(116px + env(safe-area-inset-bottom))}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--green);font-weight:750;margin:0 0 5px}h1{font-size:29px;letter-spacing:.015em;margin:0 0 5px;line-height:1.25}h2{font-size:20px;margin:0 0 5px}p{margin:0}.sub,.hint{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}.stat strong{display:block;font-size:25px;line-height:1.2;color:var(--green);font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e9eae3;padding:4px;border-radius:14px;margin-bottom:22px;position:sticky;top:0;z-index:3}nav button{background:transparent;border:0;border-radius:10px;font-size:14px;padding:8px 3px;white-space:nowrap}nav button[aria-selected=true]{background:white;color:var(--green);box-shadow:0 1px 4px #243d3810}.sectionhead{margin-bottom:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.toolbar button{font-size:14px}.list{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.person{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.person:last-child{border:0}.name{font-weight:700;overflow-wrap:anywhere}.choices{display:flex;gap:5px}.choices button{min-width:58px;padding:5px 8px;font-size:14px}.choices .pending{min-width:44px;padding:5px 6px;font-size:12px;color:var(--muted)}.groupnote{padding:8px 12px;color:var(--muted);font-size:12px;background:#f2f4ef}.notice{border-radius:12px;background:var(--soft);color:var(--orange);font-size:14px;padding:11px 13px;margin:12px 0;overflow-wrap:anywhere}.notice.good{background:var(--mint);color:var(--green)}.day{font-weight:750;font-size:14px;margin:18px 0 7px;color:var(--muted);letter-spacing:.03em}.slot{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}.slothead{display:flex;align-items:center;justify-content:space-between;gap:8px}.slot-title{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}.time{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}.district{font-size:19px;font-weight:800}.count{font-size:12px;color:var(--green);background:var(--mint);border-radius:20px;padding:3px 9px;white-space:nowrap}.count.empty{background:#f0f1ed;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tag{background:var(--mint);border-radius:8px;padding:5px 9px;font-size:14px;overflow-wrap:anywhere}.slotedit{width:100%;margin-top:10px;color:var(--green);background:#f8faf7;border-color:#dae6de}.emptytext{color:var(--muted);font-size:14px;margin-top:8px}.footer{position:fixed;bottom:0;left:0;right:0;background:#f7f5eff5;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:4;backdrop-filter:blur(12px)}.footinner{max-width:688px;margin:auto;display:flex;gap:8px;align-items:center}.footinner .primary{flex:1}.primary{background:var(--green);color:white;border-color:var(--green);font-size:16px;min-height:49px}.quiet{font-size:13px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#172a2666;z-index:10;display:flex;justify-content:center;align-items:flex-end}.overlay[hidden]{display:none}.sheet{width:min(100%,720px);max-height:88dvh;background:white;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:16px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #162c2622}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheethead button{min-width:44px}.sheetbody{overflow:auto;overscroll-behavior:contain;padding:10px 0;min-height:0}.pick{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;margin:6px 0;padding:10px;min-height:50px;cursor:pointer}.pick:has(input:checked){background:var(--mint);border-color:#9dc8b2}.pick input{width:21px;height:21px;accent-color:var(--green);margin:0}.pick small{font-size:12px;color:var(--muted);text-align:right}.sheetfoot{display:flex;gap:8px;padding-top:10px}.sheetfoot .primary{flex:1}.summarybox{padding:14px;background:white;border:1px solid var(--line);border-radius:14px;margin:10px 0}.summarybox h3{font-size:15px;margin:0 0 8px}.summaryrow{padding:9px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.summaryrow:first-of-type{border-top:0}.summaryrow span{color:var(--muted);font-size:13px;display:block}.toast{position:fixed;bottom:calc(89px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;background:#243d38;color:white;border-radius:12px;padding:10px 16px;font-size:14px;max-width:90%;text-align:center}.toast[hidden]{display:none}.danger{color:var(--red)}[hidden]{display:none!important}@media(max-width:365px){.wrap{padding-left:10px;padding-right:10px}.person{padding:10px 8px}.choices{gap:3px}.choices button{min-width:49px;padding:5px 6px}.choices .pending{min-width:38px}.name{font-size:14px}}@media(min-width:720px){.overlay{align-items:center}.sheet{max-width:540px;border-radius:22px;padding:22px}}
</style>
</head><body>
<main class="wrap"><header><p class="eyebrow">DECEMBER 2026 · SERVICE PLANNER</p><h1>總會人員配對</h1><p class="sub">先確認上場意願，再安排日期與地區。</p></header>
<div class="stats" id="stats" aria-live="polite"></div>
<nav role="tablist" aria-label="操作步驟"><button type="button" role="tab" data-tab="people" aria-selected="true">① 上場名單</button><button type="button" role="tab" data-tab="schedule" aria-selected="false">② 分配場次</button><button type="button" role="tab" data-tab="summary" aria-selected="false">③ 配對結果</button></nav>
<section id="people" role="tabpanel"><div class="sectionhead"><h2>誰要上場？</h2><p class="hint">逐組確認「有上」或「沒上」，尚未確認的可保留待定。</p></div><div class="toolbar"><button id="allYes">全部有上</button><button id="allPending">全部待定</button></div><div class="list" id="peopleList"></div></section>
<section id="schedule" role="tabpanel" hidden><div class="sectionhead"><h2>依日期安排人員</h2><p class="hint">點選場次即可勾選一組或多組人員；同一組也可安排多場。</p></div><div id="unassigned"></div><div id="slotList"></div></section>
<section id="summary" role="tabpanel" hidden><div class="sectionhead"><h2>配對結果</h2><p class="hint">確認場次及人員，再一鍵複製到 LINE。</p></div><div id="summaryWarnings"></div><div class="summarybox"><h3>依場次檢視</h3><div id="summarySlots"></div></div><div class="summarybox"><h3>依人員檢視</h3><div id="summaryPeople"></div></div><div class="toolbar"><button id="download">匯出備份 JSON</button><button id="importBtn">匯入備份</button><input type="file" id="importFile" accept="application/json,.json" hidden><button class="danger" id="reset">清空全部</button></div><p class="hint">資料僅儲存在目前瀏覽器，換手機或瀏覽器請使用備份。不是多人同步系統。</p></section>
</main><footer class="footer"><div class="footinner"><button class="quiet" id="back" hidden>上一步</button><button class="primary" id="next">下一步：分配場次</button></div></footer>
<div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheethead"><div><h2 id="sheetTitle"></h2><p class="hint" id="sheetSubtitle"></p></div><button id="closeSheet" aria-label="關閉">✕</button></div><div class="sheetbody" id="sheetBody"></div><div class="sheetfoot"><button id="clearSlot">取消全選</button><button class="primary" id="saveSlot">確認分配</button></div></section></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const names=['劉玉華','陳美秀','蔡欣潔','江玉瑜','陳進旺','陳峟仁','簡清華','陳秀婷','芷芩與美秀','美玉與淑玲','江泓吟','黃建達','廖幸洋','吳洛榛+黃淑君'];
const slots=[['12/19','六','14:00','民權'],['12/19','六','19:30','四維'],['12/20','日','10:00','成功'],['12/20','日','14:00','信義'],['12/25','五','10:00','和平'],['12/25','五','14:00','永安'],['12/25','五','19:30','長安'],['12/26','六','10:00','復興'],['12/26','六','14:00','民族'],['12/26','六','19:30','中山']];
const key='general-meeting-matcher-2026-v1', $=id=>document.getElementById(id), ids=names.map((_,i)=>i), fresh=()=>({status:names.map(()=> 'pending'),assign:slots.map(()=>[])});
let state=fresh(),tab='people',editing=-1,draft=new Set(),lastFocus=null,timer,storageOK=true;
function normalize(x){if(!x||!Array.isArray(x.status)||!Array.isArray(x.assign)||x.status.length!==names.length||x.assign.length!==slots.length)throw Error('格式不符');if(x.status.some(s=>!['yes','no','pending'].includes(s))||x.assign.some(a=>!Array.isArray(a)||a.some(i=>!Number.isInteger(i)||i<0||i>=names.length)))throw Error('格式不符');return {status:[...x.status],assign:x.assign.map(a=>[...new Set(a)].filter(i=>x.status[i]==='yes'))};}
try{const raw=localStorage.getItem(key);if(raw)state=normalize(JSON.parse(raw));}catch(e){storageOK=false;}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;notify('瀏覽器無法儲存，請匯出備份。');}}
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000);}
function dateLabel(s){return `${s[0]}（${s[1]}） ${s[2]} ${s[3]}`;}
const yes=()=>ids.filter(i=>state.status[i]==='yes'), byPerson=i=>slots.map((s,j)=>state.assign[j].includes(i)?j:-1).filter(j=>j>=0), unassigned=()=>yes().filter(i=>!byPerson(i).length);
function changeStatus(i,s){if(s!=='yes'&&byPerson(i).length&&!confirm(`「${names[i]}」已分配場次，改為非上場將移除其所有場次。確定嗎？`))return;state.status[i]=s;if(s!=='yes')state.assign=state.assign.map(a=>a.filter(j=>j!==i));persist();render();}
function bulk(s){if(s!=='yes'&&state.assign.some(a=>a.length)&&!confirm('這會清除所有場次分配，確定嗎？'))return;state.status=names.map(()=>s);if(s!=='yes')state.assign=slots.map(()=>[]);persist();render();}
function stats(){const a=yes().length,n=state.status.filter(s=>s==='no').length; $('stats').innerHTML=`<div class="stat"><strong>${a}</strong><span>有上／14 組</span></div><div class="stat"><strong>${n}</strong><span>沒上 · 待定 ${14-a-n}</span></div><div class="stat"><strong>${state.assign.filter(a=>a.length).length}/10</strong><span>已安排場次</span></div>`;}
function renderPeople(){ $('peopleList').innerHTML=names.map((n,i)=>`${i===11?'<div class="groupnote">其餘 3 組</div>':''}<div class="person"><span class="name">${n}</span><div class="choices">${[['yes','有上'],['no','沒上'],['pending','待定']].map(([s,l])=>`<button class="${s}" data-person="${i}" data-status="${s}" aria-label="${n} ${l}" aria-pressed="${state.status[i]===s}">${l}</button>`).join('')}</div></div>`).join('');}
function warnings(){const a=unassigned(),p=state.status.filter(s=>s==='pending').length,e=state.assign.filter(x=>!x.length).length;let h='';if(a.length)h+=`<div class="notice">尚未分配（${a.length} 組）：${a.map(i=>names[i]).join('、')}</div>`;if(!yes().length)h+='<div class="notice">目前沒有已確認上場的組別，請先回到上場名單。</div>';if(tab==='summary'){if(p)h+=`<div class="notice">仍有 ${p} 組待定。</div>`;if(e)h+=`<div class="notice">還有 ${e} 個場次未安排人員。</div>`;}if(!h&&yes().length)h='<div class="notice good">所有已確認上場的人員皆已安排。</div>';return h;}
function renderSlots(){ $('unassigned').innerHTML=warnings();$('slotList').innerHTML=slots.map((s,j)=>`${j===0||slots[j-1][0]!==s[0]?`<div class="day">${s[0]}（${s[1]}）</div>`:''}<article class="slot"><div class="slothead"><div class="slot-title"><span class="time">${s[2]}</span><span class="district">${s[3]}</span></div><span class="count ${state.assign[j].length?'':'empty'}">${state.assign[j].length?state.assign[j].length+' 組':'未安排'}</span></div>${state.assign[j].length?`<div class="tags">${state.assign[j].map(i=>`<span class="tag">${names[i]}</span>`).join('')}</div>`:'<p class="emptytext">尚無人員</p>'}<button class="slotedit" data-slot="${j}" ${yes().length?'':'disabled'}>${state.assign[j].length?'編輯分配':'＋ 選擇人員'}</button></article>`).join('');}
function renderSummary(){ $('summaryWarnings').innerHTML=warnings();$('summarySlots').innerHTML=slots.map((s,j)=>`<div class="summaryrow"><strong>${dateLabel(s)}</strong><span>${state.assign[j].map(i=>names[i]).join('、')||'尚未安排'}</span></div>`).join('');$('summaryPeople').innerHTML=names.map((n,i)=>`<div class="summaryrow"><strong>${n}</strong><span>${state.status[i]==='yes'?(byPerson(i).map(j=>dateLabel(slots[j])).join('／')||'有上 · 尚未分配'):state.status[i]==='no'?'沒上':'待定'}</span></div>`).join('');}
function render(){stats();renderPeople();renderSlots();renderSummary();}
function setTab(t){tab=t;for(const id of ['people','schedule','summary']){$(id).hidden=id!==t;document.querySelector(`[data-tab="${id}"]`).setAttribute('aria-selected',String(id===t));}$('back').hidden=t==='people';$('next').textContent=t==='people'?'下一步：分配場次':t==='schedule'?'下一步：檢查結果':'複製結果到 LINE';render();window.scrollTo(0,0);}
function drawSheet(){const body=$('sheetBody');body.innerHTML=yes().map(i=>{const other=byPerson(i).filter(j=>j!==editing);return `<label class="pick"><input type="checkbox" data-pick="${i}" ${draft.has(i)?'checked':''}><strong>${names[i]}</strong><small>${other.length?'其他 '+other.length+' 場':'尚無其他場'}</small></label>`;}).join('');$('sheetSubtitle').textContent=`已選 ${draft.size} 組／可選 ${yes().length} 組`;}
function openSlot(j){editing=j;draft=new Set(state.assign[j]);lastFocus=document.activeElement;$('sheetTitle').textContent=dateLabel(slots[j]);drawSheet();$('overlay').hidden=false;document.body.style.overflow='hidden';$('closeSheet').focus();}
function closeSlot(){$('overlay').hidden=true;document.body.style.overflow='';editing=-1;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function saveSlot(){const j=editing;if(j<0)return;state.assign[j]=[...draft].sort((a,b)=>a-b);persist();closeSlot();render();document.querySelector(`[data-slot="${j}"]`)?.focus({preventScroll:true});notify('已儲存場次分配');}
function resultText(){const a=unassigned(),no=ids.filter(i=>state.status[i]==='no'),p=ids.filter(i=>state.status[i]==='pending');return ['【總會人員配對表】',...slots.map((s,j)=>`${dateLabel(s)}\n${state.assign[j].map(i=>names[i]).join('、')||'（尚未安排）'}`),'',`尚未分配：${a.map(i=>names[i]).join('、')||'無'}`,`沒上：${no.map(i=>names[i]).join('、')||'無'}`,`待定：${p.map(i=>names[i]).join('、')||'無'}`].join('\n');}
async function copyResult(){const t=resultText();try{await navigator.clipboard.writeText(t);notify('已複製，可貼到 LINE');}catch(e){const box=document.createElement('textarea');box.value=t;box.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(box);box.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}box.remove();if(ok)notify('已複製，可貼到 LINE');else window.prompt('請長按並複製配對結果',t);}}
$('peopleList').addEventListener('click',e=>{const b=e.target.closest('[data-person]');if(b)changeStatus(Number(b.dataset.person),b.dataset.status);});$('allYes').onclick=()=>bulk('yes');$('allPending').onclick=()=>bulk('pending');document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab);});$('slotList').addEventListener('click',e=>{const b=e.target.closest('[data-slot]');if(b)openSlot(Number(b.dataset.slot));});$('sheetBody').addEventListener('change',e=>{if(!e.target.matches('[data-pick]'))return;const i=Number(e.target.dataset.pick);e.target.checked?draft.add(i):draft.delete(i);$('sheetSubtitle').textContent=`已選 ${draft.size} 組／可選 ${yes().length} 組`;});$('closeSheet').onclick=closeSlot;$('clearSlot').onclick=()=>{draft.clear();drawSheet();};$('saveSlot').onclick=saveSlot;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSlot();});document.addEventListener('keydown',e=>{if(editing<0)return;if(e.key==='Escape')closeSlot();if(e.key==='Tab'){const f=[...$('overlay').querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus();}}});$('next').onclick=()=>tab==='people'?setTab('schedule'):tab==='schedule'?setTab('summary'):copyResult();$('back').onclick=()=>setTab(tab==='summary'?'schedule':'people');$('reset').onclick=()=>{if(confirm('確定清空所有名單狀態及場次分配？')){state=fresh();persist();setTab('people');}};
$('download').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}));a.href=u;a.download='總會配對備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const incoming=normalize(JSON.parse(await f.text()));if(confirm('匯入將取代目前所有配對資料，確定嗎？')){state=incoming;persist();render();notify('已匯入備份');}}catch(err){notify('無法匯入：備份格式不符');}e.target.value='';};
render();if(!storageOK)notify('本機資料讀取受限，請記得匯出備份。');
</script></body></html>
